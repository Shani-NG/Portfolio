<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RoleFit — Cross-checking Preview</title>
  <style>
    :root{color-scheme:dark;font-family:Outfit,Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;background:#0b0d12;color:#f2efea}main{min-height:100vh;display:grid;place-items:center;padding:24px}.canvas{width:min(100%,760px);min-height:min(92vh,820px);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 44%,rgba(184,216,208,.045),transparent 39%),#0b0d12}.label{color:#93bdb2;font-size:.76rem;font-weight:600;letter-spacing:.19em;line-height:1}.caption{margin:24px 24px 0;color:#c9c3bc;font-size:clamp(1rem,1.4vw,1.12rem);line-height:1.3;text-align:center}.viewport{position:relative;display:grid;place-items:center;width:min(100%,460px);height:min(58vh,460px);margin-top:16px}.halo{position:absolute;width:min(calc(70.2% + 32px),500px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(184,216,208,.12),transparent 62%);filter:blur(18px);opacity:.7}.unit{position:relative;width:min(70.2%,468px);aspect-ratio:1;border-radius:50%;overflow:hidden;background:#0b0d12;isolation:isolate}.unit::before{content:"";position:absolute;inset:0;z-index:0;border-radius:50%;background:#0b0d12}.unit img,.unit svg{display:block;width:100%;height:100%;object-fit:contain;transform:scale(.85);transform-origin:center;border-radius:50%}.unit img{position:relative;z-index:1}.unit svg{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:visible}.connect{fill:none;stroke-dasharray:18 14;stroke-linecap:round;animation:connect 5.8s ease-in-out infinite}.endpoint{animation:pulse 2.2s ease-in-out infinite}.graphGlow{animation:pulse 2.2s ease-in-out infinite;transform-origin:center}.smallHighlight{animation:smallPulse 2.8s ease-in-out infinite;transform-origin:center}.spark{transform-box:fill-box;transform-origin:center;animation:spark 2.8s ease-in-out infinite}.spark:nth-of-type(2){animation-delay:.35s}.spark:nth-of-type(3){animation-delay:.7s}.spark:nth-of-type(4){animation-delay:1.05s}.spark:nth-of-type(5){animation-delay:1.4s}.spark:nth-of-type(6){animation-delay:1.75s}@keyframes connect{0%,10%{stroke-dashoffset:180;opacity:0}18%{opacity:.8}68%{stroke-dashoffset:0;opacity:.8}80%,100%{stroke-dashoffset:-90;opacity:0}}@keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.08)}}@keyframes smallPulse{0%,100%{opacity:.25;transform:scale(.75)}50%{opacity:.95;transform:scale(1.12)}}@keyframes spark{0%,18%,100%{opacity:.12;transform:scale(.65)}35%,55%{opacity:.95;transform:scale(1.08)}70%{opacity:.2;transform:scale(.8)}}@media (prefers-reduced-motion:reduce){.connect,.endpoint,.graphGlow,.smallHighlight,.spark{animation:none}.connect{stroke-dashoffset:0;opacity:.55}.endpoint,.smallHighlight,.spark{opacity:.7}}
  </style>
</head>
<body><main><section class="canvas" aria-label="RoleFit cross-checking preview">
  <div class="label">CROSS-CHECKING</div><p class="caption">Comparing role requirements with evidence...</p>
  <div class="viewport"><div class="halo" aria-hidden="true"></div><div class="unit">
    <img src="client/public/fit-analyze-b.png" alt="Role requirements and resume evidence being cross-checked" />
    <svg viewBox="0 0 1254 1254" aria-hidden="true" preserveAspectRatio="xMidYMid meet">
      <!-- Endpoints sit at the inward-facing middle edges of the two upper cards. -->
      <path class="connect" d="M575 305 C606 278 650 278 681 305" stroke="#F2C0CE" stroke-width="7" stroke-opacity=".9" />
      <path class="connect" d="M575 326 C606 353 650 353 681 326" stroke="#B8D8D0" stroke-width="5" stroke-opacity=".75" style="animation-delay:.8s" />
      <circle class="endpoint" cx="575" cy="315" r="9" fill="#B8D8D0" /><circle class="endpoint" cx="681" cy="315" r="9" fill="#F2C0CE" style="animation-delay:.35s" />
      <circle class="graphGlow" cx="628" cy="641" r="15" fill="none" stroke="#F2C0CE" stroke-width="4" stroke-opacity=".8" />
      <circle class="smallHighlight" cx="628" cy="641" r="7" fill="#F2C0CE" />
      <g fill="none" stroke-linecap="round">
        <g class="spark" stroke="#F2C0CE" stroke-width="5"><path d="M360 800v28M346 814h28"/><circle cx="360" cy="814" r="5" fill="#fff" stroke="none"/></g>
        <g class="spark" stroke="#B8D8D0" stroke-width="5"><path d="M438 887v28M424 901h28"/><circle cx="438" cy="901" r="5" fill="#fff" stroke="none"/></g>
        <g class="spark" stroke="#F2C0CE" stroke-width="5"><path d="M529 771v26M516 784h26"/><circle cx="529" cy="784" r="4.5" fill="#fff" stroke="none"/></g>
        <g class="spark" stroke="#B8D8D0" stroke-width="5"><path d="M686 889v28M672 903h28"/><circle cx="686" cy="903" r="5" fill="#fff" stroke="none"/></g>
        <g class="spark" stroke="#F2C0CE" stroke-width="5"><path d="M875 858v28M861 872h28"/><circle cx="875" cy="872" r="5" fill="#fff" stroke="none"/></g>
        <g class="spark" stroke="#B8D8D0" stroke-width="5"><path d="M792 1031v26M779 1044h26"/><circle cx="792" cy="1044" r="4.5" fill="#fff" stroke="none"/></g>
      </g>
    </svg>
  </div></div>
</section></main></body></html>
